spring:
  application:
    name: api
  config:
    # Lee el .env de la raíz del repositorio (fuera de Git) como archivo
    # .properties. Si no existe, se usan las variables del entorno.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/villaserena}
    username: ${DB_USER:villaserena}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Las tablas las crea Flyway (Josué); Hibernate no las toca.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    # Mailpit del Docker local (villa-serena-infra): SMTP sin autenticación.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # Mailpit no usa TLS; en un servidor real se activa con MAIL_STARTTLS=true.
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  flyway:
    # Valores de los placeholders de V6__datos_iniciales.sql. Vienen del
    # entorno (.env, fuera de Git); ver .env.example. Sin valor, Flyway falla.
    placeholders:
      demo_password_hash: ${DEMO_PASSWORD_HASH}
      canal1_key_hash: ${CANAL1_KEY_HASH}
      canal2_key_hash: ${CANAL2_KEY_HASH}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

villaserena:
  zona-horaria: America/Guatemala
  cors:
    origenes: ${CORS_ORIGENES:http://localhost:3000}
  jwt:
    # Clave HMAC en Base64 (al menos 32 bytes). Solo en el .env.
    secreto: ${JWT_SECRET}
    acceso-minutos: 15
    refresh-dias: 7
  login:
    intentos-maximos: 5
    bloqueo-minutos: 15
  primer-admin:
    correo: ${ADMIN_EMAIL:}
    nombre: ${ADMIN_NAME:}
    contrasena: ${ADMIN_PASSWORD:}
  web-url: ${WEB_URL:http://localhost:3000}
  reservas:
    # 30 minutos (PAR-06). Para probar puedes bajarlo en tu .env.
    minutos-pago: ${MINUTOS_PAGO:30}
  stripe:
    clave-secreta: ${STRIPE_SECRET_KEY:}
    webhook-secreto: ${STRIPE_WEBHOOK_SECRET:}
    url-retorno-app: ${APP_URL_RETORNO:villaserena://pago-resultado}
  archivos:
    url-publica: ${ARCHIVOS_URL_PUBLICA:http://localhost:9000/villaserena-publico}
  notificaciones:
    # Remitente de los correos y enlace de descarga de la app (HU-HUE-07 C4).
    remitente: ${MAIL_FROM:Hotel Villa Serena <no-responder@villaserena.test>}
    app-descarga-url: ${APP_DOWNLOAD_URL:http://localhost:9000/villaserena-publico/app/villaserena.apk}
    # Reintentos del Outbox (RN-NOT-003): 5 intentos, esperando 1 minuto más
    # cada vez (1, 2, 3, 4 minutos) antes de darlos por FALLIDO.
    intentos-maximos: 5
    espera-minutos: 1
    # Cuántos correos pendientes toma cada vuelta del proceso programado.
    lote: 20
