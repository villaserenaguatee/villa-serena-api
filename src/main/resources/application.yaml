spring:
  application:
    name: api
  servlet:
    multipart:
      # Las imágenes admiten hasta 5 MiB (se valida en el servicio con un mensaje
      # claro); este tope solo corta subidas mucho mayores.
      max-file-size: 10MB
      max-request-size: 11MB
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/villaserena}
    username: ${DB_USER:villaserena}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Las tablas las crea Flyway; Hibernate no las toca, solo comprueba que las
      # entidades correspondan al esquema y falla al arrancar si algo no cuadra.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    # Mailpit en dev: SMTP sin autenticación.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # Mailpit no usa TLS; en un servidor real se activa con MAIL_STARTTLS=true.
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  flyway:
    # All profiles migrate the schema only. Local fixtures are loaded explicitly.
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  health:
    mail:
      # El API no depende del correo para funcionar: si el SMTP está caído, los
      # avisos esperan en el outbox y salen después (RN-NOT-003). Por eso el
      # correo no debe poner /actuator/health en DOWN.
      enabled: false

villaserena:
  zona-horaria: America/Guatemala
  cors:
    origenes: ${CORS_ORIGENES:http://localhost:3000}
  jwt:
    # Clave HMAC en Base64 (al menos 32 bytes). Solo en el .env.
    secreto: ${JWT_SECRET}
    acceso-minutos: 15
    refresh-dias: 7
  login:
    intentos-maximos: 5
    bloqueo-minutos: 15
  primer-admin:
    habilitado: ${BOOTSTRAP_ADMIN_ENABLED:false}
    correo: ${ADMIN_EMAIL:}
    nombre: ${ADMIN_NAME:}
    contrasena: ${ADMIN_PASSWORD:}
  web-url: ${WEB_URL:http://localhost:3000}
  reservas:
    # 30 minutos (PAR-06). Para probar puedes bajarlo en tu .env.
    minutos-pago: ${MINUTOS_PAGO:30}
  recurrente:
    clave-publica: ${RECURRENTE_PUBLIC_KEY:}
    clave-secreta: ${RECURRENTE_SECRET_KEY:}
    webhook-secreto: ${RECURRENTE_WEBHOOK_SECRET:}
    url-retorno-app: ${APP_URL_RETORNO:villaserena://pago-resultado}
  archivos:
    url-publica: ${ARCHIVOS_URL_PUBLICA:}
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${STORAGE_REGION:us-east-1}
    usuario: ${STORAGE_ACCESS_KEY_ID:}
    contrasena: ${STORAGE_SECRET_ACCESS_KEY:}
    estilo-ruta: ${STORAGE_PATH_STYLE:false}
    bucket-privado: ${STORAGE_BUCKET_PRIVATE:}
    # Vigencia de la URL firmada de las fotos privadas (incidencias).
    minutos-url-firmada: 10
  notificaciones:
    # Remitente de los correos y enlace de descarga de la app (HU-HUE-07 C4).
    remitente: ${MAIL_FROM:Hotel Villa Serena <no-responder@villaserena.test>}
    # API de Expo para las push de la app (HU-HUE-17). En las pruebas se apunta
    # a un servidor local.
    expo-push-url: ${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
    app-descarga-url: ${APP_DOWNLOAD_URL:}
    # Reintentos del Outbox (RN-NOT-003): 5 intentos, esperando 1 minuto más
    # cada vez (1, 2, 3, 4 minutos) antes de darlos por FALLIDO.
    intentos-maximos: 5
    espera-minutos: 1
    # Cuántos correos pendientes toma cada vuelta del proceso programado.
    lote: 20

---
spring:
  config:
    activate:
      on-profile: local | dev
logging:
  level:
    root: INFO
    com.villaserena.api: DEBUG
