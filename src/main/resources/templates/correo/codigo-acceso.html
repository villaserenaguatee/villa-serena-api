<!DOCTYPE html>
<!--
  Código de acceso a la app (HU-HUE-08). Lo encola AccesoHuespedService y lo
  envía el Outbox. Nunca lleva datos de la reserva: solo el código.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tu código de acceso</title>
</head>
<body style="margin:0;padding:24px;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#27272a;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;background:#ffffff;border-radius:8px;">
    <tr>
        <td style="padding:24px;background:#0f766e;border-radius:8px 8px 0 0;">
            <h1 style="margin:0;font-size:20px;color:#ffffff;">Hotel Villa Serena</h1>
        </td>
    </tr>
    <tr>
        <td style="padding:24px;">
            <p style="margin:0 0 16px;font-size:16px;">
                Hola <span th:text="${nombreHuesped}">Nombre del huésped</span>,
                este es tu código para entrar a la app:
            </p>
            <p style="margin:0 0 16px;text-align:center;">
                <span style="display:inline-block;padding:16px 28px;background:#ecfdf5;border:1px solid #0f766e;border-radius:8px;font-size:30px;letter-spacing:6px;font-weight:bold;"
                      th:text="${codigo}">000000</span>
            </p>
            <p style="margin:0 0 8px;font-size:14px;">
                Vence en <span th:text="${minutos}">10</span> minutos y sirve una sola vez.
            </p>
            <p style="margin:0;font-size:14px;color:#71717a;">
                Si no pediste este código, no hagas nada: sin él nadie puede entrar.
            </p>
        </td>
    </tr>
    <tr>
        <td style="padding:16px 24px;background:#fafafa;border-radius:0 0 8px 8px;font-size:12px;color:#71717a;">
            Este correo se envía automáticamente; no hace falta responderlo.
        </td>
    </tr>
</table>
</body>
</html>
