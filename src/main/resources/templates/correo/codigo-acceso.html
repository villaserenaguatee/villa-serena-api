<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Su código de acceso</title><style>@media only screen and (max-width:480px){.outer{padding:16px 10px!important}.content{padding:20px!important}.title{font-size:28px!important}.code{font-size:36px!important;letter-spacing:6px!important}}</style></head>
<body style="margin:0;padding:0;background:#F8F6F0;color:#0D2D52;font-family:Arial,Helvetica,sans-serif"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#F8F6F0" style="width:100%;background:#F8F6F0"><tr><td class="outer" align="center" style="padding:24px 16px"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#ffffff" style="width:100%;max-width:600px;background:#ffffff;border:1px solid #e7e1d8;border-top:3px solid #e4bc3f;border-radius:12px"><tr><td align="center" style="padding:8px 20px 0"><img src="cid:villa-serena-logo" alt="Villa Serena Hotel" width="150" height="150" style="display:block;width:150px;height:150px;border:0"></td></tr><tr><td class="content" style="padding:8px 32px 28px"><h1 class="title" style="margin:0 0 22px;font-family:Georgia,'Times New Roman',serif;font-weight:normal;font-size:32px;line-height:1.2;color:#0D2D52">Su código de acceso</h1><p style="margin:0 0 16px;font-size:15px;line-height:1.6">Hola, <span th:text="${nombreHuesped}"></span>:</p><p style="margin:0 0 16px;font-size:15px;line-height:1.6">Utilice este código para iniciar sesión en el portal de Villa Serena</p><div style="background:#F8F6F0;border:1px solid #e7e1d8;border-radius:8px;padding:18px;margin:18px 0"><div style="text-align:center"><span class="code" th:text="${codigo}" style="display:block;font-size:44px;line-height:1.2;font-weight:bold;letter-spacing:8px;color:#0D2D52"></span><p style="font-size:13px;line-height:1.5;margin:12px 0 0">Este código vence en <span th:text="${minutos}"></span> minutos y puede utilizarse una sola vez</p></div></div><p style="margin:0 0 16px;font-size:15px;line-height:1.6">No comparta este código. Si no solicitó este acceso, ignore este mensaje</p><table role="presentation" cellpadding="0" cellspacing="0" style="margin:22px 0 0"><tr><td bgcolor="#0D2D52" style="background:#0D2D52;border-radius:8px;text-align:center"><a th:href="${accesoUrl}" style="display:inline-block;padding:15px 24px;color:#ffffff;text-decoration:none;font-size:15px;font-family:Arial,Helvetica,sans-serif;font-weight:bold;border-radius:8px">Iniciar sesión</a></td></tr></table></td></tr></table><p style="margin:18px 0 0;color:#52647a;font-size:12px;line-height:1.5">Villa Serena Hotel</p></td></tr></table></body></html>
