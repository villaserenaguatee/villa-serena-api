<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tu factura de estancia</title><style>@media only screen and (max-width:480px){.outer{padding:16px 10px!important}.content{padding:20px!important}.title{font-size:28px!important}.code{font-size:36px!important;letter-spacing:6px!important}}</style></head>
<body style="margin:0;padding:0;background:#F8F6F0;color:#0D2D52;font-family:Arial,Helvetica,sans-serif"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#F8F6F0" style="width:100%;background:#F8F6F0"><tr><td class="outer" align="center" style="padding:24px 16px"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#ffffff" style="width:100%;max-width:600px;background:#ffffff;border:1px solid #e7e1d8;border-top:3px solid #e4bc3f;border-radius:12px"><tr><td align="center" style="padding:8px 20px 0"><img src="cid:villa-serena-logo" alt="Villa Serena Hotel" width="150" height="150" style="display:block;width:150px;height:150px;border:0"></td></tr><tr><td class="content" style="padding:8px 32px 28px"><h1 class="title" style="margin:0 0 22px;font-family:Georgia,'Times New Roman',serif;font-weight:normal;font-size:32px;line-height:1.2;color:#0D2D52">Tu factura de estancia</h1><p style="margin:0 0 16px;font-size:15px;line-height:1.6">Hola, <span th:text="${nombreHuesped}"></span>:</p><p style="margin:0 0 16px;font-size:15px;line-height:1.6">Gracias por hospedarte en Villa Serena. Adjuntamos el PDF con los detalles de tu estancia</p><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;table-layout:fixed"><tr><td width="40%" style="padding:12px 0;border-bottom:1px solid #e7e1d8;color:#52647a;font-size:14px;vertical-align:top;overflow-wrap:anywhere">Número de factura</td><td style="padding:12px 0 12px 12px;border-bottom:1px solid #e7e1d8;font-size:14px;line-height:1.5;text-align:right;vertical-align:top;overflow-wrap:anywhere;word-break:break-word"><span th:text="${serieNumero}"></span></td></tr><tr><td width="40%" style="padding:12px 0;border-bottom:1px solid #e7e1d8;color:#52647a;font-size:14px;vertical-align:top;overflow-wrap:anywhere">Reserva</td><td style="padding:12px 0 12px 12px;border-bottom:1px solid #e7e1d8;font-size:14px;line-height:1.5;text-align:right;vertical-align:top;overflow-wrap:anywhere;word-break:break-word"><span th:text="${codigoReserva}"></span></td></tr><tr><td width="40%" style="padding:12px 0;border-bottom:1px solid #e7e1d8;color:#52647a;font-size:14px;vertical-align:top;overflow-wrap:anywhere">Comprador</td><td style="padding:12px 0 12px 12px;border-bottom:1px solid #e7e1d8;font-size:14px;line-height:1.5;text-align:right;vertical-align:top;overflow-wrap:anywhere;word-break:break-word"><span th:text="${nombreComprador}"></span></td></tr><tr><td width="40%" style="padding:12px 0;border-bottom:1px solid #e7e1d8;color:#52647a;font-size:14px;vertical-align:top;overflow-wrap:anywhere">NIT</td><td style="padding:12px 0 12px 12px;border-bottom:1px solid #e7e1d8;font-size:14px;line-height:1.5;text-align:right;vertical-align:top;overflow-wrap:anywhere;word-break:break-word"><span th:text="${nit}"></span></td></tr></table><div style="background:#F8F6F0;border:1px solid #e7e1d8;border-radius:8px;padding:18px;margin:18px 0"><table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td style="font-size:14px">Total, IVA incluido</td><td style="text-align:right;font-size:20px;font-weight:bold"><span th:text="${total}"></span></td></tr></table></div></td></tr></table><p style="margin:18px 0 0;color:#52647a;font-size:12px;line-height:1.5">Villa Serena Hotel</p></td></tr></table></body></html>
