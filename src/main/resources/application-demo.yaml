# Perfil "demo": entorno local y presentación. Se activa explícitamente con
# SPRING_PROFILES_ACTIVE=demo. Nunca en una configuración de producción.
spring:
  flyway:
    # Además del esquema, carga los datos ficticios (hotel, habitaciones,
    # tarifas, menú, canales simulados y empleados de prueba).
    locations: classpath:db/migration,classpath:db/demo
    # Valores de los placeholders de db/demo/V6__datos_iniciales.sql. Vienen
    # del entorno (.env, fuera de Git); ver .env.example. Sin valor, el API no
    # arranca.
    placeholders:
      demo_password_hash: ${DEMO_PASSWORD_HASH}
      canal1_key_hash: ${CANAL1_KEY_HASH}
      canal2_key_hash: ${CANAL2_KEY_HASH}
