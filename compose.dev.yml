name: villa-serena-dev
services:
  postgres:
    extends:
      file: compose.local.yml
      service: postgres
  api:
    extends:
      file: compose.local.yml
      service: api
    env_file: !override [.env.dev]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MAIL_HOST: mailpit
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  prometheus:
    image: prom/prometheus:v3.13.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ${PROMETHEUS_CONFIG:-./docker/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:13.0.10
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
