name: villa-serena-dev
services:
  postgres:
    extends:
      file: compose.local.yml
      service: postgres
  api:
    extends:
      file: compose.local.yml
      service: api
    env_file: !override [.env.dev]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MAIL_HOST: mailpit
      MINIO_ENDPOINT: http://minio:9000
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-villaserena}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-13T00-00-00Z
    depends_on: [minio]
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-villaserena}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_PUBLIC: ${MINIO_BUCKET_PUBLIC:-villaserena-publico}
      MINIO_BUCKET_PRIVATE: ${MINIO_BUCKET_PRIVATE:-villaserena-privado}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        for attempt in $$(seq 1 30); do
          if mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; then break; fi
          sleep 2
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET_PUBLIC"
        mc mb --ignore-existing "local/$$MINIO_BUCKET_PRIVATE"
        mc anonymous set download "local/$$MINIO_BUCKET_PUBLIC"
        mc anonymous set none "local/$$MINIO_BUCKET_PRIVATE"
  prometheus:
    image: prom/prometheus:v3.13.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ${PROMETHEUS_CONFIG:-./docker/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:13.0.10
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
volumes:
  postgres-data:
  minio-data:
  prometheus-data:
  grafana-data:
