name: API CD to EC2

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: villa-serena-api-production
  cancel-in-progress: false

jobs:
  build-push-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify application before deployment
        run: |
          chmod +x mvnw
          ./mvnw -B verify
      - name: AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_API_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/villaserenaguatee/villa-serena-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy API only via SSM Run Command
        env:
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
          REGION: ${{ vars.AWS_REGION }}
          IMAGE_URI: ghcr.io/villaserenaguatee/villa-serena-api:${{ github.sha }}
        run: |
          set -euo pipefail
          : "${INSTANCE_ID:?Missing AWS_EC2_INSTANCE_ID}"
          : "${REGION:?Missing AWS_REGION}"
          # SSM command values passed as JSON; files transferred as base64 to
          # avoid depending on any public SSH endpoint.
          python3 - <<'PY'
          import base64, json, os, subprocess, time
          compose = base64.b64encode(open("compose.prod.yml", "rb").read()).decode()
          deploy = base64.b64encode(open("scripts/deploy-ec2.sh", "rb").read()).decode()
          # Paths and values come from trusted workflow configuration.
          cmds = [
            "set -eu",
            "install -d -m 700 /opt/villa-serena/api",
            f"echo '{compose}' | base64 -d > /opt/villa-serena/api/compose.yml",
            f"echo '{deploy}' | base64 -d > /opt/villa-serena/api/deploy.sh",
            "chmod 700 /opt/villa-serena/api/deploy.sh",
            f"IMAGE_URI='{os.environ['IMAGE_URI']}' AWS_REGION='{os.environ['REGION']}' /opt/villa-serena/api/deploy.sh"
          ]
          payload = json.dumps({"commands": cmds})
          command_id = subprocess.check_output(
              ["aws", "ssm", "send-command",
               "--instance-ids", os.environ["INSTANCE_ID"],
               "--document-name", "AWS-RunShellScript",
               "--parameters", payload,
               "--region", os.environ["REGION"],
               "--query", "Command.CommandId", "--output", "text"], text=True).strip()
          print(f"Dispatched SSM command {command_id}. Polling for completion...")

          terminal_statuses = {"Success", "Failed", "Cancelled", "TimedOut", "Cancelling"}
          max_timeout_seconds = 900
          poll_interval = 10
          elapsed = 0
          info = None

          while elapsed < max_timeout_seconds:
              time.sleep(poll_interval)
              elapsed += poll_interval
              try:
                  info_raw = subprocess.check_output(
                      ["aws", "ssm", "get-command-invocation",
                       "--command-id", command_id,
                       "--instance-id", os.environ["INSTANCE_ID"],
                       "--region", os.environ["REGION"], "--output", "json"], text=True)
                  info = json.loads(info_raw)
                  status = info.get("Status", "Unknown")
                  print(f"[{elapsed}s] SSM Status: {status}")
                  if status in terminal_statuses:
                      break
              except subprocess.CalledProcessError:
                  print(f"[{elapsed}s] Waiting for SSM invocation to become ready...")

          if not info:
              print(f"Deployment timed out after {max_timeout_seconds}s waiting for SSM response.")
              raise SystemExit(1)

          status = info.get("Status", "Unknown")
          print(f"Final SSM Execution Status: {status}")

          stdout = info.get("StandardOutputContent", "").strip()
          stderr = info.get("StandardErrorContent", "").strip()

          if status == "Success":
              print("=== DEPLOYMENT OUTPUT ===")
              if stdout:
                  print(stdout[-4000:])
          else:
              print(f"=== DEPLOYMENT FAILED (Status: {status}) ===")
              if stderr:
                  print("--- STDERR ---")
                  print(stderr[-4000:])
              if stdout:
                  print("--- STDOUT ---")
                  print(stdout[-4000:])
              raise SystemExit(1)
          PY
