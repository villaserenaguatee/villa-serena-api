name: API CI

on:
  pull_request:
    branches: [main, develop, dev]
  push:
    branches: [main, develop, dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven verify
        run: |
          chmod +x mvnw
          ./mvnw -B verify
