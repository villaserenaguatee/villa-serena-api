  # ====================================================================
  # /habitaciones — Recepción (HU-REC-07, HU-REC-10, HU-REC-11)
  # ====================================================================
  /api/v1/habitaciones:
    get:
      tags: [habitaciones]
      operationId: listarEstadoHabitaciones
      summary: Estado de las habitaciones
      description: |
        HU-REC-10 · RF-HAB-001, RF-HAB-003. Rol `RECEPCION`. Ocupación, condición
        e indicadores calculados con "hoy" en America/Guatemala. Para una
        habitación `FUERA_DE_SERVICIO` incluye, en solo lectura, la incidencia que
        la bloquea (P-02). Los cambios llegan en tiempo real por el WebSocket
        (`/topic/habitaciones`, parte 2). Lista vacía si nada cumple los filtros.
      parameters:
        - name: ocupacion
          in: query
          schema:
            $ref: '#/components/schemas/OcupacionHabitacion'
        - name: condicion
          in: query
          schema:
            $ref: '#/components/schemas/CondicionHabitacion'
        - name: tipoHabitacionId
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: piso
          in: query
          schema:
            type: integer
          example: 2
      responses:
        '200':
          description: Habitaciones activas con su estado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HabitacionEstado'
              example:
                - id: 3
                  numero: '103'
                  piso: 1
                  tipoHabitacion:
                    id: 1
                    nombre: Doble Superior
                  ocupacion: LIBRE
                  condicion: LIMPIA
                  llegaHoy: true
                  saleHoy: false
                  incidenciaPendiente: false
                  incidenciaBloqueante: null
                - id: 9
                  numero: '201'
                  piso: 2
                  tipoHabitacion:
                    id: 2
                    nombre: Suite Volcán
                  ocupacion: LIBRE
                  condicion: FUERA_DE_SERVICIO
                  llegaHoy: false
                  saleHoy: false
                  incidenciaPendiente: false
                  incidenciaBloqueante:
                    id: 15
                    descripcion: Fuga de agua en el baño.
                    estado: EN_PROCESO
                    reportadaEn: '2026-10-02T08:30:00-06:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

