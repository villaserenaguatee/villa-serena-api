                  responsable:
                    id: 7
                    nombre: María López
                  stockResultante: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
          example: 1
    post:
      tags:
        - admin
      operationId: registrarMovimientoInventarioAdmin
      summary: Registrar entrada o salida
      description: >-
        HU-ADM-13


        Cantidad>0 y motivo obligatorio. SALIDA que supera stock=409; bloquear producto y registrar responsable.
        Solo movimientos manuales: otros módulos no modifican stock.
      security:
        - bearerAuth: []
