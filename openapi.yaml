    ruta: /api/v1/pagos/stripe/webhook
    eventos:
      - checkout.session.completed
      - checkout.session.expired
    reglas:
      - Distinguir pago de reserva inicial y pago de saldo por metadata/identificador almacenado de la sesión.
      - Idempotencia por id del evento. Nunca confiar en el retorno del navegador para aprobar un pago.
      - En saldo, registrar APROBADO sin emitir factura ni finalizar reserva; eso ocurre solo en check-out.
    revision: Extensión funcional del mismo webhook para saldo; confirmar con Pablo. No cambia su forma de
      petición/respuesta.
  efectosAutomaticos:
    - "Correo de confirmación en CONFIRMADA, OTP al solicitar y factura al emitir: Outbox, sin endpoints de
      envío manual."
    - Cargo único de pedido ENTREGADO; sin endpoint para generar cargo manual de Room Service.
    - Factura dentro de check-out, sin endpoint independiente de emisión.
    - Cancelación de reserva web a los 30 minutos según estado de Stripe, sin endpoint de no-show.
    - Check-out cancela solicitudes PENDIENTE/EN_PROCESO y pedidos NUEVO/EN_PREPARACION, motivo Estadía
      finalizada; bloquea EN_CAMINO.
  pendientesDeRevision:
    - Nombres nuevos de rutas, campos y operationId con Josué.
    - Permisos por rol, área, propiedad, responsable y JWT con Pablo.
    - Endpoint /ws, encabezado ticket, eventos y payload push con Hugo/Pablo.
    - "Nivel 2 es opcional: amenidades/Wi-Fi, turnos e inventario; no obliga a implementarlo para el hito."
