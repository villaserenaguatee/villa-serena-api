        roles:
          - ADMIN
        nivel: 2
        condiciones: "Cantidad>0 y motivo obligatorio. SALIDA que supera stock=409; bloquear producto y registrar
          responsable. Solo movimientos manuales: otros módulos no modifican stock."
      responses:
        "201":
          description: Registrar entrada o salida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovimientoInventario"
              example:
                id: 1
                productoId: 1
                tipo: ENTRADA
                cantidad: 1
                motivo: Registrado por error
                fechaHora: 2026-10-02T14:30:00-06:00
                responsable:
                  id: 7
                  nombre: María López
                stockResultante: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovimientoInventarioPeticion"
            example:
              tipo: ENTRADA
              cantidad: 10
              motivo: Reposición de prueba

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso de 15 minutos emitido por /api/v1/auth.
    canalCodigo:
      type: apiKey
      in: header
      name: X-Canal-Codigo
      description: Código del canal externo (por ejemplo, BOOKING o EXPEDIA).
    canalClave:
      type: apiKey
      in: header
      name: X-Canal-Clave
      description: Clave del canal; el servidor la compara con su hash.
    stripeFirma:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: Firma del webhook de Stripe.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    CodigoReservaPath:
      name: codigo
      in: path
      required: true
      description: Código de la reserva.
      schema:
        $ref: '#/components/schemas/CodigoReserva'
      example: VS-7K2M9Q
    Entrada:
      name: entrada
      in: query
      required: true
      description: Fecha de entrada (YYYY-MM-DD).
      schema:
        $ref: '#/components/schemas/FechaEstadia'
      example: '2026-10-15'
    Salida:
      name: salida
      in: query
      required: true
      description: Fecha de salida (YYYY-MM-DD).
      schema:
        $ref: '#/components/schemas/FechaEstadia'
      example: '2026-10-17'
    Huespedes:
      name: huespedes
      in: query
      required: true
      description: Número de huéspedes.
      schema:
        type: integer
        minimum: 1
      example: 2

  responses:
    BadRequest:
      description: Datos inválidos o incompletos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: DATOS_INVALIDOS
            mensaje: Los datos enviados no son válidos.
            detalles:
              - campo: correo
                mensaje: El correo no tiene un formato válido.
    Unauthorized:
      description: Sin sesión, token vencido o credenciales incorrectas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: NO_AUTENTICADO
            mensaje: Debes iniciar sesión para continuar.
            detalles: []
    Forbidden:
      description: El usuario no tiene permiso para esta acción.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: ACCESO_DENEGADO
            mensaje: Acceso denegado.
            detalles: []
    NotFound:
      description: El recurso no existe o no pertenece al usuario.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: NO_ENCONTRADO
            mensaje: No se encontró el recurso solicitado.
            detalles: []
    Conflict:
      description: La acción no es válida en el estado actual del recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: ESTADO_INVALIDO
            mensaje: La acción no se puede realizar en el estado actual.
            detalles: []
    ConflictoCancelacion:
      description: La reserva no se puede cancelar (no está confirmada o es de canal externo).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: CANAL_NO_CANCELABLE
            mensaje: Las reservas de canal no se cancelan desde el sistema.
            detalles: []

  schemas:
    # ------------------------------------------------------------------
    # Error
    # ------------------------------------------------------------------
    Error:
      type: object
      description: Formato único de error del API.
      required: [codigo, mensaje, detalles]
      properties:
        codigo:
          type: string
          description: Código estable del error, en mayúsculas.
          examples: [DATOS_INVALIDOS]
        mensaje:
          type: string
          description: Mensaje en español para mostrar al usuario.
          examples: [Los datos enviados no son válidos.]
        detalles:
          type: array
          description: Detalle por campo; vacío si no aplica.
          items:
            $ref: '#/components/schemas/DetalleError'
    DetalleError:
      type: object
      required: [campo, mensaje]
      properties:
        campo:
          type: string
          examples: [correo]
        mensaje:
          type: string
          examples: [El correo no tiene un formato válido.]

    # ------------------------------------------------------------------
    # Tipos básicos
    # ------------------------------------------------------------------
    Id:
      type: integer
      format: int64
      minimum: 1
      examples: [1]
    Monto:
      type: number
      description: Monto en quetzales (GTQ) con 2 decimales, impuestos incluidos.
      multipleOf: 0.01
      examples: [1250.00]
    FechaEstadia:
      type: string
      format: date
      description: Fecha de estadía (YYYY-MM-DD).
      examples: ['2026-10-15']
    FechaHora:
      type: string
      format: date-time
      description: Fecha y hora ISO 8601 con zona.
      examples: ['2026-10-02T14:30:00-06:00']
    CodigoReserva:
      type: string
      description: Código único no secuencial de la reserva.
      pattern: '^VS-[A-Z0-9]{6}$'
      examples: [VS-7K2M9Q]

    # ------------------------------------------------------------------
    # Enums (documento 07)
    # ------------------------------------------------------------------
    EstadoReserva:
      type: string
      enum: [PENDIENTE_PAGO, CONFIRMADA, EN_ESTADIA, FINALIZADA, CANCELADA]
    EstadoCuenta:
      type: string
      enum: [ABIERTA, CERRADA]
    EstadoCargo:
      type: string
      enum: [VIGENTE, ANULADO]
    EstadoPago:
      type: string
      enum: [PENDIENTE, APROBADO, FALLIDO, REEMBOLSADO]
    MetodoPago:
      type: string
      enum: [STRIPE, CANAL, EFECTIVO, TARJETA, OTRO]
    CanalOrigen:
      type: string
      description: Canal de origen de la reserva; se asigna al crearla y no se edita.
      enum: [DIRECTO_WEB, RECEPCION, BOOKING, EXPEDIA]
    OcupacionHabitacion:
      type: string
      enum: [LIBRE, OCUPADA]
    CondicionHabitacion:
      type: string
      enum: [LIMPIA, SUCIA, EN_LIMPIEZA, FUERA_DE_SERVICIO]
    EstadoIncidencia:
      type: string
      enum: [REPORTADA, EN_PROCESO, RESUELTA]
    TipoDocumento:
      type: string
      enum: [DPI, PASAPORTE]
    RolEmpleado:
      type: string
      enum: [ADMIN, RECEPCION, ROOM_SERVICE, MANTENIMIENTO_LIMPIEZA]
    AreaMyl:
      type: string
      description: Área del personal de Mantenimiento/Limpieza.
      enum: [LIMPIEZA, MANTENIMIENTO, AMBAS]

    # ------------------------------------------------------------------
    # Autenticación
    # ------------------------------------------------------------------
    LoginPeticion:
      type: object
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          format: email
          examples: [ana.perez@villaserena.test]
        contrasena:
          type: string
          minLength: 1
          examples: [Temporal123]
    RefreshPeticion:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          examples: [3f8a1c9e-6b2d-4f7a-9c11-0d5e8b7a2f44]
    Tokens:
      type: object
      description: Par de tokens; común a personal y huésped.
      required: [accessToken, refreshToken, tipoToken, expiraEn]
      properties:
        accessToken:
          type: string
          description: JWT de acceso (15 minutos).
        refreshToken:
          type: string
          description: Refresh token rotativo (7 días).
        tipoToken:
          type: string
          const: Bearer
        expiraEn:
          type: integer
          description: Segundos de vida del token de acceso.
          examples: [900]
    EmpleadoSesion:
      type: object
      description: Datos básicos del empleado autenticado.
      required: [id, nombre, correo, rol, area, debeCambiarContrasena]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nombre:
          type: string
          examples: [Ana Pérez]
        correo:
          type: string
          format: email
          examples: [ana.perez@villaserena.test]
        rol:
          $ref: '#/components/schemas/RolEmpleado'
        area:
          description: Solo para MANTENIMIENTO_LIMPIEZA; null en los demás roles.
          oneOf:
            - $ref: '#/components/schemas/AreaMyl'
            - type: 'null'
        debeCambiarContrasena:
          type: boolean
          examples: [false]
    SesionEmpleado:
      description: Tokens más los datos del empleado.
      allOf:
        - $ref: '#/components/schemas/Tokens'
        - type: object
          required: [empleado]
          properties:
            empleado:
              $ref: '#/components/schemas/EmpleadoSesion'
    CambiarContrasenaPeticion:
      type: object
      required: [contrasenaActual, contrasenaNueva, confirmacion]
      properties:
        contrasenaActual:
          type: string
          minLength: 1
        contrasenaNueva:
          type: string
          minLength: 8
          description: Mínimo 8 caracteres, al menos una letra y un número, distinta de la actual.
        confirmacion:
          type: string
          minLength: 8

    # ------------------------------------------------------------------
    # Huéspedes
    # ------------------------------------------------------------------
    HuespedDatos:
      type: object
      description: Los 6 datos obligatorios del huésped principal (web, Recepción y canal).
      required: [nombreCompleto, correo, telefono, nacionalidad, tipoDocumento, numeroDocumento]
      properties:
        nombreCompleto:
          type: string
          minLength: 1
          maxLength: 150
          examples: [María José López]
        correo:
          type: string
          format: email
          maxLength: 150
          examples: [maria.lopez@example.com]
        telefono:
          type: string
          minLength: 1
          maxLength: 30
          examples: ['+502 5555 1234']
        nacionalidad:
          type: string
          minLength: 1
          maxLength: 60
          examples: [Guatemalteca]
        tipoDocumento:
          $ref: '#/components/schemas/TipoDocumento'
        numeroDocumento:
          type: string
          minLength: 1
          maxLength: 30
          examples: ['2547896320101']
    Huesped:
      description: Huésped principal registrado (visible para Recepción).
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              $ref: '#/components/schemas/Id'
        - $ref: '#/components/schemas/HuespedDatos'
    HuespedReferencia:
      type: object
      description: Nombre del huésped principal en listas.
      required: [id, nombreCompleto]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nombreCompleto:
          type: string
          examples: [María José López]
    HuespedAdicionalDatos:
      type: object
      required: [nombreCompleto, tipoDocumento, numeroDocumento, nacionalidad]
      properties:
        nombreCompleto:
          type: string
          minLength: 1
          maxLength: 150
          examples: [Carlos López]
        tipoDocumento:
          $ref: '#/components/schemas/TipoDocumento'
        numeroDocumento:
          type: string
          minLength: 1
          maxLength: 30
          examples: [P1234567]
        nacionalidad:
          type: string
          minLength: 1
          maxLength: 60
          examples: [Mexicana]
    HuespedAdicional:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              $ref: '#/components/schemas/Id'
        - $ref: '#/components/schemas/HuespedAdicionalDatos'

    # ------------------------------------------------------------------
    # Referencias de catálogo
    # ------------------------------------------------------------------
    TipoHabitacionReferencia:
      type: object
      required: [id, nombre]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nombre:
          type: string
          examples: [Doble Superior]
    HabitacionReferencia:
      type: object
      required: [id, numero, piso]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        numero:
          type: string
          examples: ['204']
        piso:
          type: integer
          examples: [2]

    # ------------------------------------------------------------------
    # Web pública
    # ------------------------------------------------------------------
    UrlFoto:
      type: string
      format: uri
      description: URL pública de la foto (bucket público de MinIO).
      examples: [http://localhost:9000/villa-serena-publico/hotel/fachada.jpg]
    Hotel:
      type: object
      required: [nombre, descripcion, fotos, ubicacion, contacto, horaCheckIn, horaCheckOut]
      properties:
        nombre:
          type: string
          examples: [Villa Serena]
        descripcion:
          type: string
        fotos:
          type: array
          items:
            $ref: '#/components/schemas/UrlFoto'
        ubicacion:
          type: object
          required: [direccion]
          properties:
            direccion:
              type: string
        contacto:
          type: object
          required: [telefono, correo]
          properties:
            telefono:
              type: string
            correo:
              type: string
              format: email
        horaCheckIn:
          type: string
          description: Hora fija de check-in.
          const: '15:00'
        horaCheckOut:
          type: string
          description: Hora fija de check-out.
          const: '12:00'
    TipoHabitacionPublico:
      type: object
      required: [id, nombre, descripcion, capacidad, precioBaseNoche, fotos]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nombre:
          type: string
          examples: [Doble Superior]
        descripcion:
          type: string
        capacidad:
          type: integer
          minimum: 1
          description: Capacidad máxima de huéspedes.
          examples: [4]
        precioBaseNoche:
          $ref: '#/components/schemas/Monto'
        fotos:
          type: array
          description: Puede estar vacía (la web usa una imagen genérica).
          items:
            $ref: '#/components/schemas/UrlFoto'
    PrecioNoche:
      type: object
      description: Precio de una noche y los ajustes que lleva.
      required: [fecha, precio, temporada, finDeSemana]
      properties:
        fecha:
          $ref: '#/components/schemas/FechaEstadia'
        precio:
          $ref: '#/components/schemas/Monto'
        temporada:
          type: [string, 'null']
          description: Nombre de la temporada aplicada; null si no hay.
          examples: [Temporada alta]
        finDeSemana:
          type: boolean
          description: Verdadero si es viernes o sábado (lleva el ajuste de fin de semana).
    CotizacionEstadia:
      type: object
      required: [noches, total, desglose]
      properties:
        noches:
          type: integer
          minimum: 1
          maximum: 30
        total:
          $ref: '#/components/schemas/Monto'
        desglose:
          type: array
          items:
            $ref: '#/components/schemas/PrecioNoche'
    OpcionDisponiblePublica:
      description: Tipo disponible para la web pública (sin cantidad de habitaciones restantes).
      allOf:
        - type: object
          required: [tipoHabitacion]
          properties:
            tipoHabitacion:
              $ref: '#/components/schemas/TipoHabitacionPublico'
        - $ref: '#/components/schemas/CotizacionEstadia'
    ReservaWebPeticion:
      type: object
      required: [tipoHabitacionId, entrada, salida, numeroHuespedes, huesped]
      properties:
        tipoHabitacionId:
          $ref: '#/components/schemas/Id'
        entrada:
          $ref: '#/components/schemas/FechaEstadia'
        salida:
          $ref: '#/components/schemas/FechaEstadia'
        numeroHuespedes:
          type: integer
          minimum: 1
        huesped:
          $ref: '#/components/schemas/HuespedDatos'
    ReservaWebCreada:
      type: object
      required: [codigo, estado, tipoHabitacion, entrada, salida, noches, numeroHuespedes, total, pagoVenceEn]
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoReserva'
        estado:
          $ref: '#/components/schemas/EstadoReserva'
        tipoHabitacion:
          $ref: '#/components/schemas/TipoHabitacionReferencia'
        entrada:
          $ref: '#/components/schemas/FechaEstadia'
        salida:
          $ref: '#/components/schemas/FechaEstadia'
        noches:
          type: integer
        numeroHuespedes:
          type: integer
        total:
          $ref: '#/components/schemas/Monto'
        pagoVenceEn:
          description: Momento en que la reserva se cancela sola si no se paga (30 minutos).
          allOf:
            - $ref: '#/components/schemas/FechaHora'
    PagoIniciado:
      type: object
      required: [urlPago, expiraEn]
      properties:
        urlPago:
          type: string
          format: uri
          description: Página de Stripe Checkout.
        expiraEn:
          $ref: '#/components/schemas/FechaHora'
    EstadoReservaPublico:
      type: object
      description: Solo el estado; sin datos personales (VIS-03).
      required: [codigo, estadoReserva, estadoPago, puedeReintentar]
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoReserva'
        estadoReserva:
          $ref: '#/components/schemas/EstadoReserva'
        estadoPago:
          description: Estado del pago en línea de la reserva; null si aún no se inició.
          oneOf:
            - $ref: '#/components/schemas/EstadoPago'
            - type: 'null'
        puedeReintentar:
          type: boolean
          description: Verdadero mientras la reserva siga PENDIENTE_PAGO.

    # ------------------------------------------------------------------
    # Stripe y canal
    # ------------------------------------------------------------------
    EventoStripe:
      type: object
      description: Evento de Stripe tal como lo envía Stripe (solo se listan los campos usados).
      required: [id, type, data]
