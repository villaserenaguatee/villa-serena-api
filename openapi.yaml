        - tipoHabitacion
        - ocupacion
        - condicion
        - llegaHoy
        - saleHoy
        - incidenciaPendiente
        - incidenciaBloqueante
      properties:
        id:
          $ref: '#/components/schemas/Id'
        numero:
          type: string
          examples: ['103']
        piso:
          type: integer
