        roles:
          - ADMIN
        nivel: 2
      responses:
        "200":
          description: Editar producto de inventario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductoInventario"
              example:
                id: 1
                nombre: Villa Serena
                categoria: Amenidades
                unidadMedida: Unidad
                stockMinimo: 0
                stockActual: 0
                stockBajo: false
                estado: ACTIVO
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditarProductoInventarioPeticion"
            example:
              nombre: Villa Serena
              categoria: Amenidades
              unidadMedida: Unidad
              stockMinimo: 0
  /api/v1/admin/inventario/productos/{id}/desactivar:
    post:
      tags:
        - admin
      operationId: desactivarProductoInventarioAdmin
      summary: Desactivar producto
      description: HU-ADM-13
      security:
        - bearerAuth: []
      x-historias:
        - HU-ADM-13
      x-requisitos:
        - RF-ADM-004
        - RF-ADM-016
      x-autorizacion:
        roles:
          - ADMIN
        nivel: 2
      responses:
        "200":
          description: Desactivar producto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductoInventario"
              example:
                id: 1
                nombre: Villa Serena
                categoria: Amenidades
                unidadMedida: Unidad
                stockMinimo: 0
                stockActual: 0
                stockBajo: false
                estado: INACTIVO
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
          example: 1
  /api/v1/admin/inventario/productos/{id}/movimientos:
    get:
      tags:
        - admin
      operationId: historialInventarioAdmin
      summary: Consultar movimientos de producto
      description: |-
        HU-ADM-13

        Historial por fecha con tipo, cantidad, motivo y responsable.
      security:
        - bearerAuth: []
      x-historias:
        - HU-ADM-13
      x-requisitos:
        - RF-ADM-004
        - RF-ADM-016
      x-autorizacion:
        roles:
          - ADMIN
        nivel: 2
        condiciones: Historial por fecha con tipo, cantidad, motivo y responsable.
      responses:
        "200":
          description: Consultar movimientos de producto.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MovimientoInventario"
