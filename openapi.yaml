    get:
      tags: [habitaciones]
      operationId: listarHabitacionesAsignables
      summary: Habitaciones que se pueden asignar
      description: |
        HU-REC-07 (criterio 2), HU-REC-04 (criterio 2) · RF-HAB-002. Rol
        `RECEPCION`. Habitaciones activas del tipo indicado que no están
        `FUERA_DE_SERVICIO` y no tienen otra reserva activa que se traslape con
