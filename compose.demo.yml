# Stack de demostración: PostgreSQL 17 + API (Spring Boot con perfil demo).
# Arranca el esquema vacío. Los datos locales se cargan después con scripts/demo/load-data.sql.
#
# Requisitos:
#   1. Tener un archivo .env en la raíz de api (copia de .env.example) con las contraseñas y hashes:
#        POSTGRES_PASSWORD, JWT_SECRET
#
# Uso:
#   docker compose -f compose.demo.yml up -d --build
#   docker compose -f compose.demo.yml logs -f api
#   docker compose -f compose.demo.yml down

name: villa-serena-demo

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-villaserena}
      POSTGRES_USER: ${POSTGRES_USER:-villaserena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private database password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-villaserena} -d $${POSTGRES_DB:-villaserena}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - villa-serena-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-villaserena}
      DB_USER: ${POSTGRES_USER:-villaserena}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set a private database password}
      JWT_SECRET: ${JWT_SECRET:?Set a private JWT secret}
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:3000}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - villa-serena-net

volumes:
  postgres-data:

networks:
  villa-serena-net:
    driver: bridge
